<!DOCTYPE html>
<html lang="en" data-theme="liquid-glass">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IISERKonnect Web</title>
  <meta name="description" content="Web version of IISERKonnect — the IISER Kolkata campus app. WeLearn, mess, calendar, library, research, network dashboard and serverless P2P chat." />
  <meta name="theme-color" content="#070A12" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles/main.css?v=7" />
</head>
<body id="top">
  <a class="skip-link" href="#outlet">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="sidebar__brand" href="#/home">
        <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--primary)"/>
          <path d="M10 13.5c0-2.6 3-4.3 6.5-4.3S23 10.9 23 13.5s-3 4.3-6.5 4.3h-.6L12 21v-3.6c-1.3-.8-2-1.9-2-2.9Z" fill="none" stroke="white" stroke-width="1.9" stroke-linejoin="round"/>
        </svg>
        <span class="brand__text">IISER<span>Konnect</span></span>
        <span class="brand__badge">web</span>
      </a>

      <button class="sidebar__search" type="button" onclick="location.hash='#/settings'" aria-label="Search settings">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        <span>Search…</span>
        <kbd>⌘K</kbd>
      </button>

      <nav class="side-nav" aria-label="Primary"></nav>

      <div class="sidebar__foot">
        <button class="side-link" id="theme-btn" type="button"></button>
        <div class="sidebar__foot-meta">
          <span class="tiny" style="color:var(--text-faint);">IISER Kolkata · Unofficial</span>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <button class="nav-burger" id="burger" aria-label="Open navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <nav class="topbar__breadcrumb" id="topbar-breadcrumb" aria-label="Breadcrumb"><strong id="topbar-title">Home</strong></nav>
        <div class="topbar__actions">
          <span class="proxy-pill off" id="proxy-pill"><span class="proxy-pill__dot"></span>Offline</span>
          <span class="proxy-dot off" id="proxy-dot" hidden></span>
        </div>
      </header>
      <main class="outlet" id="outlet" tabindex="-1"></main>
    </div>
  </div>

  <div class="nav-drawer" id="drawer"></div>

  <script type="module" src="./scripts/main.js?v=7"></script>
</body>
</html>
