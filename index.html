<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IISERKonnect Web</title>
  <meta name="description" content="IISERKonnect in the browser — the IISER Kolkata campus app's screens, themes and on-device tools, running entirely in your browser with no backend." />
  <meta name="theme-color" content="#1E1714" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preload" href="./assets/fonts/roboto-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./styles/main.css" />
  <script>
    /* Paint the chosen theme's background before the modules load, so a light
       theme does not flash dark. The full palette is applied by core/theme.js. */
    (function () {
      var bg = { 0: "#1E1714", 1: "#FFF8F0", 3: "#1E1E2E", 4: "#EFF1F5", 5: "#1A1B26", 6: "#F7F3ED", 7: "#000000", 8: "#0C1626", 9: "#FFF6F0", 10: "#FFFFFF", 11: "#000000" };
      var m = 0;
      try { var s = JSON.parse(localStorage.getItem("iiserk-web") || "{}"); if (typeof s["pref.themeMode"] === "number") m = s["pref.themeMode"]; } catch (e) {}
      if (m === 2) m = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? 0 : 1;
      document.documentElement.style.background = bg[m] || bg[0];
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <nav class="rail" id="rail" aria-label="Primary"></nav>
    <main class="stage" id="stage"></main>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>
  </div>
  <noscript><p style="padding:24px;font-family:sans-serif">IISERKonnect Web needs JavaScript: every screen is built in your browser.</p></noscript>
  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
