<!DOCTYPE html>
<html lang="en" data-theme="liquid-glass">
<head>

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />

<body id="top">

          <defs><linearGradient id="bm-g" x1="6" y1="4" x2="42" y2="44">
            <stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="var(--accent)"/>

          <rect x="5" y="5" width="38" height="38" rx="12" fill="url(#bm-g)"/>
          <path d="M15 20.5c0-3.6 4-6 9-6s9 2.4 9 6-4 6-9 6h-.8L18 31v-4.9c-1.9-1.1-3-2.7-3-4.6Z"
